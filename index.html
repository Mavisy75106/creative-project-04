<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Use Agent Simulator — UI-TARS Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface2: #1a2236;
  --border: #1e2a42;
  --text: #e2e8f0;
  --text-dim: #64748b;
  --accent: #38bdf8;
  --accent2: #818cf8;
  --green: #34d399;
  --orange: #fbbf24;
  --red: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}
.app {
  display: flex;
  height: 100vh;
}
/* Sidebar */
.sidebar {
  width: 300px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--accent);
  text-transform: uppercase;
}
.sidebar-header p {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}
.agent-status {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.agent-model {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  background: rgba(56,189,248,0.08);
  padding: 2px 8px;
  border-radius: 4px;
}
.metrics {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.metric {
  text-align: center;
}
.metric-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}
.metric-label {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}
.thought-log {
  flex: 1;
  padding: 16px 20px;
  overflow-y: auto;
}
.thought-log h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.thought-item {
  padding: 10px 12px;
  background: var(--surface2);
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 12px;
  border-left: 3px solid var(--accent);
  opacity: 0;
  transform: translateX(-10px);
  animation: slideIn 0.3s forwards;
}
.thought-item.action { border-left-color: var(--orange); }
.thought-item.success { border-left-color: var(--green); }
.thought-item.error { border-left-color: var(--red); }
.thought-phase {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}
.thought-text {
  color: var(--text);
  line-height: 1.4;
}
@keyframes slideIn {
  to { opacity: 1; transform: translateX(0); }
}

/* Main canvas area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}
.canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#mainCanvas {
  width: 100%;
  height: 100%;
  display: block;
}
/* Overlay controls */
.controls {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 10;
}
.ctrl-btn {
  padding: 10px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: blur(12px);
  background: rgba(17,24,39,0.85);
}
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.ctrl-btn.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.ctrl-btn.primary:hover { background: #7dd3fc; }

/* Progress bar */
.progress-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border);
  z-index: 10;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.5s ease;
  width: 0%;
}

/* Top info bar */
.top-bar {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.top-bar-left {
  display: flex;
  gap: 16px;
  align-items: center;
}
.task-badge {
  padding: 6px 14px;
  background: rgba(17,24,39,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-dim);
}
.task-badge strong {
  color: var(--text);
  font-weight: 600;
}
.agent-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(17,24,39,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
}
.agent-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}

/* Target info popup */
.target-info {
  position: absolute;
  background: rgba(17,24,39,0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.25s;
  min-width: 200px;
}
.target-info.visible {
  opacity: 1;
  transform: translateY(0);
}
.target-info .label {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.target-info .value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--accent);
  margin-top: 2px;
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 240px; }
  .metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
  .ctrl-btn { padding: 8px 14px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🧠 Computer Use Agent</h1>
      <p>UI-TARS Multimodal Agent Simulator</p>
    </div>
    <div class="agent-status">
      <div class="status-row">
        <div class="status-dot"></div>
        <span>Agent Active — <span class="agent-model">UI-TARS-7B</span></span>
      </div>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-value" id="metricSteps">0</div>
        <div class="metric-label">Steps</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="metricTokens">0</div>
        <div class="metric-label">Tokens</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="metricAccuracy">0%</div>
        <div class="metric-label">Accuracy</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="metricLatency">0ms</div>
        <div class="metric-label">Avg Latency</div>
      </div>
    </div>
    <div class="thought-log">
      <h3>Agent Thought Log</h3>
      <div id="thoughtLog"></div>
    </div>
  </aside>

  <!-- Main Canvas -->
  <main class="main">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="task-badge">Task: <strong id="taskLabel">Navigate to Settings → Dark Mode</strong></div>
      </div>
      <div class="agent-badge">
        <div class="dot"></div>
        <span>Live Simulation</span>
      </div>
    </div>
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
      <div class="target-info" id="targetInfo">
        <div class="label">Detected Element</div>
        <div class="value" id="targetValue">—</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="resetSim()">↺ Reset</button>
      <button class="ctrl-btn primary" id="startBtn" onclick="startSim()">▶ Start Agent</button>
      <button class="ctrl-btn" onclick="toggleSpeed()">⏩ Speed</button>
    </div>
  </main>
</div>

<script>
// ── Canvas Setup ──
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const container = canvas.parentElement;
  W = canvas.width = container.clientWidth * devicePixelRatio;
  H = canvas.height = container.clientHeight * devicePixelRatio;
  canvas.style.width = container.clientWidth + 'px';
  canvas.style.height = container.clientHeight + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const cw = () => canvas.parentElement.clientWidth;
const ch = () => canvas.parentElement.clientHeight;

// ── Desktop UI Elements (the "screen" the agent sees) ──
const desktopElements = [
  // Window: Settings
  { type: 'window', x: 0.12, y: 0.08, w: 0.76, h: 0.72, title: '⚙️ Settings', color: '#1e293b' },
  // Menu items inside Settings
  { type: 'menu', x: 0.15, y: 0.14, w: 0.22, h: 0.06, label: 'General', id: 'menu-general' },
  { type: 'menu', x: 0.15, y: 0.21, w: 0.22, h: 0.06, label: 'Appearance', id: 'menu-appearance' },
  { type: 'menu', x: 0.15, y: 0.28, w: 0.22, h: 0.06, label: 'Notifications', id: 'menu-notif' },
  { type: 'menu', x: 0.15, y: 0.35, w: 0.22, h: 0.06, label: 'Keyboard', id: 'menu-keyboard' },
  { type: 'menu', x: 0.15, y: 0.42, w: 0.22, h: 0.06, label: 'Privacy', id: 'menu-privacy' },
  // Toggle: Dark Mode
  { type: 'toggle', x: 0.44, y: 0.16, w: 0.35, h: 0.06, label: 'Dark Mode', id: 'toggle-dark', on: false },
  // Toggle: Auto Update
  { type: 'toggle', x: 0.44, y: 0.23, w: 0.35, h: 0.06, label: 'Auto-Update', id: 'toggle-update', on: true },
  // Text input
  { type: 'input', x: 0.44, y: 0.30, w: 0.35, h: 0.06, label: 'Search settings...', id: 'input-search' },
  // Save button
  { type: 'button', x: 0.56, y: 0.40, w: 0.10, h: 0.05, label: 'Save', id: 'btn-save' },
  // Sidebar desktop icons (background)
  { type: 'icon', x: 0.92, y: 0.12, w: 0.06, h: 0.06, label: '📁' },
  { type: 'icon', x: 0.92, y: 0.24, w: 0.06, h: 0.06, label: '🖥️' },
  { type: 'icon', x: 0.92, y: 0.36, w: 0.06, h: 0.06, label: '📊' },
  // Taskbar
  { type: 'taskbar', x: 0, y: 0.88, w: 1, h: 0.06 },
  // Start button
  { type: 'button', x: 0.02, y: 0.885, w: 0.05, h: 0.05, label: '⊞', id: 'btn-start' },
  // Clock
  { type: 'clock', x: 0.90, y: 0.885, w: 0.08, h: 0.05, label: '12:16 PM' },
];

// ── Agent State ──
let agentState = 'idle'; // idle, scanning, targeting, acting, done
let scanProgress = 0;
let highlightTarget = null;
let highlightAlpha = 0;
let mousePos = { x: 0, y: 0 };
let mouseTarget = { x: 0, y: 0 };
let stepCount = 0;
let tokenCount = 0;
let latencies = [];
let simSpeed = 1;
let animFrame;
let particles = [];
let scanLine = 0;
let scanLineDir = 1;

// ── Simulation Sequence ──
const taskSteps = [
  { phase: 'OBSERVE', text: 'Scanning screen layout... detecting UI elements', duration: 2000 },
  { phase: 'ANALYZE', text: 'Identified: Settings window with 5 menu items, 2 toggles', duration: 1500 },
  { phase: 'PLAN', text: 'Task: "Navigate to Settings → Dark Mode"', duration: 1200 },
  { phase: 'PLAN', text: 'Target found: "Dark Mode" toggle in Appearance section', duration: 1000 },
  { phase: 'ACTION', text: 'Clicking "Appearance" menu item', duration: 800, target: 'menu-appearance' },
  { phase: 'OBSERVE', text: 'Appearance section loaded. Detected "Dark Mode" toggle', duration: 1200 },
  { phase: 'ACTION', text: 'Toggling "Dark Mode" ON', duration: 800, target: 'toggle-dark' },
  { phase: 'ACTION', text: 'Clicking "Save" to persist changes', duration: 800, target: 'btn-save' },
  { phase: 'OBSERVE', text: 'Settings updated. Dark Mode enabled successfully', duration: 1000 },
  { phase: 'COMPLETE', text: 'Task completed! Dark Mode is now active', duration: 1500 },
];

let currentStep = 0;
let stepTimer = 0;
let simRunning = false;
let simPaused = false;

// ── Drawing Functions ──
function drawDesktop() {
  const w = cw(), h = ch();
  
  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, w * 0.5, h);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Subtle grid pattern
  ctx.strokeStyle = 'rgba(148,163,184,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  // Draw desktop elements
  desktopElements.forEach(el => {
    if (el.type === 'window') {
      drawWindow(el);
    } else if (el.type === 'menu') {
      drawMenuItem(el);
    } else if (el.type === 'toggle') {
      drawToggle(el);
    } else if (el.type === 'button') {
      drawButton(el);
    } else if (el.type === 'icon') {
      drawIcon(el);
    } else if (el.type === 'taskbar') {
      drawTaskbar(el);
    } else if (el.type === 'clock') {
      drawClock(el);
    } else if (el.type === 'input') {
      drawInput(el);
    }
  });

  // Draw scan line
  if (agentState === 'scanning') {
    const scanY = scanLine;
    ctx.strokeStyle = 'rgba(56,189,248,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, scanY);
    ctx.lineTo(w, scanY);
    ctx.stroke();
    
    // Glow
    const glow = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
    glow.addColorStop(0, 'transparent');
    glow.addColorStop(0.5, 'rgba(56,189,248,0.08)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, scanY - 20, w, 40);
  }

  // Draw highlight on target
  if (highlightTarget && highlightAlpha > 0) {
    drawHighlight(highlightTarget, highlightAlpha);
  }

  // Draw mouse cursor
  drawMouse();

  // Draw particles
  drawParticles();
}

function drawWindow(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  // Shadow
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 10;
  
  // Window background
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();
  
  ctx.shadowColor = 'transparent';
  
  // Window border
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 12);
  ctx.stroke();
  
  // Title bar
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  roundRectTop(ctx, x, y, w, 40, 12);
  ctx.fill();
  
  // Title text
  ctx.fillStyle = '#94a3b8';
  ctx.font = '13px "Plus Jakarta Sans"';
  ctx.fillText(el.title, x + 14, y + 26);
  
  // Window controls
  ['#f87171', '#fbbf24', '#34d399'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x + 18 + i * 20, y + 20, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawMenuItem(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();
  
  // Active state
  if (currentStep === 3) { // clicked appearance
    ctx.strokeStyle = 'rgba(56,189,248,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    roundRect(ctx, x, y, w, h, 8);
    ctx.stroke();
  }
  
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px "Plus Jakarta Sans"';
  ctx.fillText(el.label, x + 12, y + h / 2 + 4);
}

function drawToggle(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  // Label
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px "Plus Jakarta Sans"';
  ctx.fillText(el.label, x + 12, y + h / 2 + 4);
  
  // Toggle switch
  const tx = x + w - 40, ty = y + h / 2 - 10;
  const tw = 40, th = 20;
  
  ctx.fillStyle = el.on ? '#34d399' : '#475569';
  ctx.beginPath();
  roundRect(ctx, tx, ty, tw, th, 10);
  ctx.fill();
  
  // Thumb
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.arc(el.on ? tx + tw - 14 : tx + 14, ty + th / 2, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = 'transparent';
}

function drawButton(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  ctx.fillStyle = el.id === 'btn-save' ? '#38bdf8' : '#334155';
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 6);
  ctx.fill();
  
  if (el.id === 'btn-save') {
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11px "Plus Jakarta Sans"';
    ctx.fillText(el.label, x + w/2 - 10, y + h/2 + 4);
  } else {
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '12px "Plus Jakarta Sans"';
    ctx.fillText(el.label, x + w/2 - 8, y + h/2 + 4);
  }
}

function drawIcon(el) {
  const x = el.x * cw(), y = el.y * ch();
  const s = Math.min(el.w, el.h) * cw() * 0.9;
  
  ctx.font = `${s * 0.8}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(el.label, x + s/2, y + s/2);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function drawTaskbar(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(148,163,184,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.stroke();
}

function drawClock(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px "JetBrains Mono"';
  ctx.textAlign = 'center';
  ctx.fillText(el.label, x + w/2, y + h/2 + 4);
  ctx.textAlign = 'start';
}

function drawInput(el) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 6);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, 6);
  ctx.stroke();
  
  ctx.fillStyle = '#475569';
  ctx.font = '11px "Plus Jakarta Sans"';
  ctx.fillText(el.label, x + 10, y + h/2 + 3);
}

function drawHighlight(el, alpha) {
  const x = el.x * cw(), y = el.y * ch();
  const w = el.w * cw(), h = el.h * ch();
  
  // Pulsing glow
  const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
  
  ctx.save();
  ctx.globalAlpha = alpha * pulse;
  
  // Glow
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 20;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRect(ctx, x - 4, y - 4, w + 8, h + 8, 12);
  ctx.stroke();
  
  // Corner markers
  const cs = 12; // corner size
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  
  // Top-left
  ctx.beginPath(); ctx.moveTo(x-4, y-4+cs); ctx.lineTo(x-4, y-4); ctx.lineTo(x-4+cs, y-4); ctx.stroke();
  // Top-right
  ctx.beginPath(); ctx.moveTo(x+w+4-cs, y-4); ctx.lineTo(x+w+4, y-4); ctx.lineTo(x+w+4, y-4+cs); ctx.stroke();
  // Bottom-left
  ctx.beginPath(); ctx.moveTo(x-4, y+h+4-cs); ctx.lineTo(x-4, y+h+4); ctx.lineTo(x-4+cs, y+h+4); ctx.stroke();
  // Bottom-right
  ctx.beginPath(); ctx.moveTo(x+w+4-cs, y+h+4); ctx.lineTo(x+w+4, y+h+4); ctx.lineTo(x+w+4, y+h+4-cs); ctx.stroke();
  
  // Label
  if (el.label) {
    const tw2 = ctx.measureText(el.label).width + 16;
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    roundRect(ctx, x - 4, y - 28, tw2, 20, 6);
    ctx.fill();
    
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 10px "JetBrains Mono"';
    ctx.fillText(el.label, x + 4, y - 13);
  }
  
  ctx.restore();
}

function drawMouse() {
  // Lerp towards target
  mousePos.x += (mouseTarget.x - mousePos.x) * 0.08;
  mousePos.y += (mouseTarget.y - mousePos.y) * 0.08;
  
  // Draw cursor
  ctx.save();
  ctx.translate(mousePos.x, mousePos.y);
  
  // Cursor shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 24);
  ctx.lineTo(6, 18);
  ctx.lineTo(12, 28);
  ctx.lineTo(15, 26);
  ctx.lineTo(9, 16);
  ctx.lineTo(16, 16);
  ctx.closePath();
  ctx.fill();
  
  // Cursor body
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 24);
  ctx.lineTo(6, 18);
  ctx.lineTo(12, 28);
  ctx.lineTo(15, 26);
  ctx.lineTo(9, 16);
  ctx.lineTo(16, 16);
  ctx.closePath();
  ctx.fill();
  
  // Cursor outline
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  ctx.restore();
}

// ── Particle System ──
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Drawing Helpers ──
function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

function roundRectTop(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

// ── Simulation Logic ──
function findElById(id) {
  return desktopElements.find(e => e.id === id);
}

function getElCenter(el) {
  return {
    x: (el.x + el.w / 2) * cw(),
    y: (el.y + el.h / 2) * ch()
  };
}

function addThought(phase, text, cls = '') {
  const log = document.getElementById('thoughtLog');
  const div = document.createElement('div');
  div.className = 'thought-item' + (cls ? ' ' + cls : '');
  div.innerHTML = `<div class="thought-phase">${phase}</div><div class="thought-text">${text}</div>`;
  log.prepend(div);
  
  // Keep max 15 thoughts
  while (log.children.length > 15) log.removeChild(log.lastChild);
}

function updateMetrics() {
  document.getElementById('metricSteps').textContent = stepCount;
  document.getElementById('metricTokens').textContent = tokenCount.toLocaleString();
  
  const accuracy = currentStep > 0 ? Math.min(98, 85 + Math.random() * 10) : 0;
  document.getElementById('metricAccuracy').textContent = accuracy.toFixed(0) + '%';
  
  const avgLat = latencies.length > 0 ? Math.round(latencies.reduce((a, b) => a + b) / latencies.length) : 0;
  document.getElementById('metricLatency').textContent = avgLat + 'ms';
  
  document.getElementById('progressFill').style.width = (currentStep / taskSteps.length * 100) + '%';
}

function startStep(step, idx) {
  const el = step.target ? findElById(step.target) : null;
  
  // Update agent state
  agentState = step.phase.toLowerCase();
  highlightTarget = el;
  highlightAlpha = 1;
  
  // Move mouse to target
  if (el) {
    const center = getElCenter(el);
    mouseTarget.x = center.x;
    mouseTarget.y = center.y;
  } else {
    mouseTarget.x = cw() / 2;
    mouseTarget.y = ch() / 2;
  }
  
  // Spawn particles on actions
  if (step.phase === 'ACTION' && el) {
    const center = getElCenter(el);
    spawnParticles(center.x, center.y, '#38bdf8', 15);
  }
  
  if (step.phase === 'COMPLETE') {
    spawnParticles(cw() / 2, ch() / 2, '#34d399', 30);
  }
  
  // Add to thought log
  const cls = step.phase === 'COMPLETE' ? 'success' :
              step.phase === 'ACTION' ? 'action' : '';
  addThought(step.phase, step.text, cls);
  
  // Update metrics
  stepCount++;
  tokenCount += 800 + Math.floor(Math.random() * 600);
  latencies.push(200 + Math.floor(Math.random() * 400));
  updateMetrics();
}

function advanceStep() {
  if (currentStep >= taskSteps.length) {
    agentState = 'done';
    document.getElementById('startBtn').textContent = '✓ Complete';
    document.getElementById('startBtn').style.background = '#34d399';
    document.getElementById('startBtn').style.borderColor = '#34d399';
    return;
  }
  
  const step = taskSteps[currentStep];
  startStep(step, currentStep);
  
  // Schedule next step
  const delay = step.duration / simSpeed;
  setTimeout(() => {
    currentStep++;
    advanceStep();
  }, delay);
}

function startSim() {
  if (agentState === 'done') return;
  
  simRunning = true;
  document.getElementById('startBtn').textContent = '⏸ Running...';
  document.getElementById('startBtn').style.background = '#fbbf24';
  document.getElementById('startBtn').style.borderColor = '#fbbf24';
  document.getElementById('startBtn').style.color = '#0f172a';
  
  advanceStep();
}

function resetSim() {
  simRunning = false;
  currentStep = 0;
  stepCount = 0;
  tokenCount = 0;
  latencies = [];
  agentState = 'idle';
  highlightTarget = null;
  highlightAlpha = 0;
  particles = [];
  mousePos = { x: 0, y: 0 };
  mouseTarget = { x: cw() / 2, y: ch() / 2 };
  
  document.getElementById('thoughtLog').innerHTML = '';
  document.getElementById('startBtn').textContent = '▶ Start Agent';
  document.getElementById('startBtn').style.background = '';
  document.getElementById('startBtn').style.borderColor = '';
  document.getElementById('startBtn').style.color = '';
  document.getElementById('progressFill').style.width = '0%';
  
  updateMetrics();
  
  // Reset toggle states
  desktopElements.forEach(el => { if (el.on !== undefined) { /* keep as is */ } });
}

function toggleSpeed() {
  simSpeed = simSpeed === 1 ? 3 : simSpeed === 3 ? 6 : 1;
  const labels = { 1: '⏩ Speed', 3: '⏩⏩ Speed x3', 6: '⏩⏩ Speed x6' };
  document.querySelector('.controls .ctrl-btn:last-child').textContent = labels[simSpeed] || '⏩ Speed';
}

// ── Main Loop ──
function loop() {
  // Update scan line
  if (agentState === 'scanning') {
    scanLine += 3 * simSpeed;
    if (scanLine > ch()) { scanLine = 0; }
  }
  
  // Fade highlight
  if (highlightAlpha > 0 && agentState !== 'acting') {
    highlightAlpha *= 0.97;
  }
  
  drawDesktop();
  animFrame = requestAnimationFrame(loop);
}

// Initialize mouse position
mousePos.x = cw() / 2;
mousePos.y = ch() / 2;

loop();

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); startSim(); }
  if (e.code === 'KeyR') resetSim();
});
</script>
